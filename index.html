  if (a.name) S.userName = a.name.charAt(0).toUpperCase()+a.name.slice(1);
  if (!S.firstMsg) S.firstMsg = {t, x:msg};
  // stile
  const u=S.user; u.msgs++; u.chars+=msg.length;
  if (a.emojis.length){ u.emojiMsgs++; for(const e of a.emojis) u.emoji[e]=(u.emoji[e]||0)+1; }
  if (msg===msg.toLowerCase()) u.lower++;

    else if (k==="X") v= xs.length ? pick(xs.slice(0,2)) : "";
    else if (k==="L") v= a&&a.like ? a.like : (S.likes.length? pick(S.likes):"");
    else if (k==="D") v= a&&a.dislike ? a.dislike : (S.dislikes.length? pick(S.dislikes):"");
    else if (k==="Y"){ v = pool.length ? pick(pool) : ""; y1=v; }
    else if (k==="Y2"){ const r=pool.filter(w=>w!==y1); v = r.length ? pick(r) : ""; }
    if (!v) ok=false; return v;
  });
  return ok ? out : null;
}
function fromTemplates(intent, a, freeOnly){
  const p = phase();
  const opts = T.filter(t=>t[0]===intent && t[1]<=p && (t[4] || (!freeOnly && allowedText(t[2]))));
  const cands = [];
  for (const t of opts){ const f = fill(t[2], a); if (f) cands.push({f, w: 1 + (t[3]? Math.max(0,S.traits[t[3]])*2.5 : 0) + t[1]*.15}); }
  if (!cands.length) return null;
  let r = rnd()*cands.reduce((s,c)=>s+c.w,0); for (const c of cands){ r-=c.w; if(r<=0) return c.f; } return cands[0].f;
}
function echo(a){
  const prev = a.content.filter(w=>S.words[w] && S.words[w].c>=2);
  let w = prev.length ? pick(prev) : (a.content.length ? pick(a.content) : null);
  if (rnd()<.15){ const all=contentWords(1); if(all.length) w=pick(all); }
  if (a.name) w = a.name;
  if (!w) return null;
  const punct = a.s<0 ? "..." : a.q ? "?" : a.s>0||a.humor ? "!" : (S.words[w].c<2?"?":"");
  return rnd()<.2 ? `${w}... ${w}${punct}` : w+punct;
}
function emoFor(a){ return a.insult?"hurt": a.s<0?"sad": a.humor||a.kind||a.s>0?"happy": a.q?"curious": a.greet?"happy":"neutral"; }
function memoryLine(){
  const old = S.quotes.filter(q=>now()-q.t > 20*HOUR); if(!old.length) return null;
  const q = pick(old), d = new Date(q.t).getDay();
  if (rnd()<.45) return `hai detto «${q.x}». era ${DAYS[(d+pick([1,6]))%7]}... no, ${DAYS[d]}.`;
  return `ricordo quando hai detto «${q.x}».`;
}
function mirrorPhrase(a){
  const ps = Object.values(S.phrases).filter(p=>p.c>=2 && (p.i===a.intent || (a.intent==="default"&&false) || (p.s===a.s && a.s!==0)) && p.i!=="insult");
  return ps.length ? pick(ps).x.toLowerCase() : null;
}
function broken(w){ return w.length>2 ? `${w[0]}... ${w[0]}${w.slice(1,3)}... ${w}?` : `${w}... ${w}?`; }

async function respond(msg, a, newW){
  const p = phase(), emo = emoFor(a);
  if (p===0){
    if (S.firstWord && rnd()<.3) return say(S.firstWord + (a.s<0?"...":a.q?"?":"!"), {emo, raw:true});
    return say(pick(G[a.intent]||G.default), {glyph:true, emo});
  }
  if (p===1){
    if (rnd()<.3) return say(pick(G[a.intent]||G.default), {glyph:true, emo});
    const e = echo(a); return e ? say(e, {emo, raw:true}) : say(pick(G.default), {glyph:true, emo});
  }
  if (p>=3 && !a.insult && rnd()<.12){ const m=memoryLine(); if(m) return say(m, {emo:"curious", raw:true}); }
  if (!a.insult && rnd()<.22){ const m=mirrorPhrase(a); if(m) return say(m, {emo}); }
  const t = fromTemplates(a.intent, a) || (a.intent!=="default" ? fromTemplates("default", a) : null);
  if (t) return say(t, {emo});
  const e = echo(a); if (e) return say(e, {emo, raw:true});
  return say(pick(G[a.intent]||G.default), {glyph:true, emo});
}

/* ================= MOMENTI ================= */
function flash(){ const f=$("#flash"); f.classList.add("on"); requestAnimationFrame(()=>requestAnimationFrame(()=>f.classList.remove("on"))); }
async function checkPhase(){
  const p = phase();
  if (p > S.phase){
    const before = litCount();
    S.phase = p; save();
    flash(); F.glitch = performance.now()+900; buzz([40,60,40,60,120]);
    [523,659,784,1046].forEach((f,i)=>tone(f,.18,"triangle",.04,i*.12));
    await wait(700);
    sysLine(`fase: *${PHASES[p]}* · ora capisce ${LIMITS[p]} caratteri`, true);
    growDots(Math.max(0,before-6), litCount()); favicon(); render();
    if (p===1 && S.firstWord) await say(S.firstWord+"!", {emo:"happy", raw:true, cap:"la sua prima parola, usata da solo. gliel'hai insegnata tu."});
    if (p===2) setHint("da adesso costruisce frasi, ma solo con parole tue");
    if (p===3 && !S.revealed) await reveal();
    if (p===4) setHint("ha una voce sua. e opinioni.");
  }
  S.litSeen = litCount();
}
async function reveal(){
  await say("ora posso dirtelo. i miei primi segni volevano dire questo.", {emo:"curious", raw:true});
  S.revealed = true; save();
  const list = S.glyphs.slice(0,6);
  openSheet("traduzione", `<p class="muted">i segni che ti mostrava prima di saper parlare</p><div id="rv"></div>`);
  const box = $("#rv");
  for (const g of list){ const e=document.createElement("div"); e.className="entry"; e.innerHTML=`<time>${dstr(g.t)} · ${hhmm(g.t)}</time>`; e.appendChild(glyphCanvas(g.x, 300)); const tr=document.createElement("div"); tr.style.marginTop="6px"; e.appendChild(tr); box.appendChild(e); await wait(500); for(const ch of "«"+g.x+"»"){ tr.textContent+=ch; await wait(40); } }
}
async function sleepNow(){
  const p = phase();
  if (p>=2 && !S.promise){ S.promise = now(); await say(fromTemplates("promise")||"...", {emo:"sad", raw:true}); }
  else if (p>=2) await say(fromTemplates("sleep")||"...", {emo:"sleep", raw:true});
  else await say(pick(G.sleep), {glyph:true, emo:"sleep"});
  S.energy.sleepUntil = now() + 3*HOUR; S.energy.used = 0;
  setEmo("sleep"); [400,300,200].forEach((f,i)=>tone(f,.25,"sine",.03,i*.25));
  setHint("si è addormentato"); save(); render();
}
function showPoem(){
  const src = S.quotes.length>=3 ? S.quotes : S.log.filter(l=>l.w==="c"&&!l.g).map(l=>({x:l.x}));
  const lines = [];
  for (let i=0;i<3;i++){ const q = pick(src); if(!q) break; const w = tokenize(q.x); if(!w.length) continue; const s=Math.floor(rnd()*Math.max(1,w.length-2)); lines.push(w.slice(s, s+2+Math.floor(rnd()*3)).join(" ")); }
  if (!lines.length) return;
  openSheet("per "+(S.userName||"te"), `<div class="poem">${lines.map(esc).join("<br>")}</div><p class="muted">fatta solo con parole tue. te l'aveva promesso.</p>`);
}
function showMirror(){
  const u=S.user, avg=a=>a.length?Math.round(a.reduce((s,x)=>s+x,0)/a.length):0;
  const top = contentWords(1).sort((a,b)=>S.words[b].c-S.words[a].c)[0];
  openSheet("specchio", `<p class="muted">il tuo primo messaggio, ${S.firstMsg?dstr(S.firstMsg.t):""}</p><div class="poem">«${esc(S.firstMsg?S.firstMsg.x:"")}»</div>
  <div class="row"><span>lunghezza media all'inizio</span><span>${avg(u.firstLens)} caratteri</span></div>
  <div class="row"><span>lunghezza media adesso</span><span>${avg(u.lens)} caratteri</span></div>
  <div class="row"><span>la parola che usi di più</span><span>${esc(top||"—")}</span></div>
  <div class="row"><span>messaggi con emoji</span><span>${Math.round(u.emojiMsgs/Math.max(1,u.msgs)*100)}%</span></div>`);
}

/* ================= ASSENZA ================= */
async function welcome(){
  const t = now(), el = S.lastSeen ? t - S.lastSeen : 0, p = phase();
  S.sessions++; S.user.hours[new Date(t).getHours()]++;
  S.hurt *= Math.pow(.5, el/(6*HOUR));
  if (el > 2*DAY) nudge("malinconia", .05);
  // diario scritto mentre eri via
  if (el > 20*60e3 && S.name){
    const n = Math.min(3, Math.floor(el/(2*HOUR)));
    for (let i=0;i<n;i++){
      const ts = S.lastSeen + (el/(n+1))*(i+1) + (rnd()-.5)*HOUR;
      const txt = p>=2 ? fromTemplates("diary") : null;
      S.diary.push(txt ? {t:ts, x:txt} : {t:ts, x:pick(G.diary), g:1});
      S.diaryUnread++;
    }
    if (S.diary.length>40) S.diary.splice(0, S.diary.length-40);
  }
  if (isAsleep()){ setEmo("sleep"); render(); return; }
  if (S.energy.sleepUntil && !isAsleep()) S.energy.sleepUntil = 0;
  render(); favicon();
  const lit = litCount();
  if (S.litSeen && lit > S.litSeen){ growDots(S.litSeen, lit); setHint(`+${lit-S.litSeen} punti mentre non c'eri`); }
  await wait(900);
  await checkPhase();
  if (!S.name) return;
  if (el < 20*60e3 && S.lastSeen){ setEmo("happy", 1500); return; }
  if (p>=3 && S.hurt>.35) await say(fromTemplates("hurtback"), {emo:"hurt", raw:true});
  else if (el > 2*DAY) await (p>=2 ? say(fromTemplates("absenceLong")||"...", {emo:"sad", raw:true}) : say(pick(G.greet), {glyph:true, emo:"sad"}));
  else await (p>=2 ? say(fromTemplates("greet")||"ciao", {emo:"happy"}) : say(pick(G.greet), {glyph:true, emo:"happy"}));
  // predizione dell'orario
  const h = S.user.hours, hr = new Date(t).getHours(), mode = h.indexOf(Math.max(...h));
  if (p>=3 && S.sessions>=6 && Math.abs(mode-hr)<=1 && rnd()<.5) await say(fromTemplates("predict"), {emo:"curious", raw:true});
  // messaggio non inviato
  if (p>=2 && el > 6*HOUR && rnd()<.6){ const u=fromTemplates("unsent"); if(u) await say(u, {ghost: hhmm(S.lastSeen + el*(.3+rnd()*.5)), raw:true}); }
  // promessa
  if (S.promise && t - S.promise > HOUR){ S.promise = 0; await say("te l'avevo promesso", {emo:"happy", raw:true}); showPoem(); }
  // specchio del tempo
  if (p>=3 && dayN()>=30 && !S.sparks.mirror){ S.sparks.mirror = 1; await say("guarda come sei cambiato", {emo:"curious", raw:true}); showMirror(); }
  // batteria
  try{ if (p>=3 && navigator.getBattery){ const b = await navigator.getBattery(); if (b.level<.15 && !b.charging) await say(fromTemplates("battery"), {emo:"surprised", raw:true}); } }catch(e){}
  if (S.diaryUnread) setHint("ha scritto nel diario mentre non c'eri");
  save();
}

/* ================= NASCITA ================= */
let holding = false, holdStart = 0, holdRaf = 0, lastBuzz = 0;
function holdTick(){
  if (!holding) return;
  const p = clamp((performance.now()-holdStart)/5000, 0, 1); F.hold = p;
  const gap = 700 - p*560;
  if (performance.now()-lastBuzz > gap){ lastBuzz = performance.now(); buzz(30+p*40); tone(55+p*40, .12, "sine", .12); }
  if (p>=1){ holding=false; hatch(); return; }
  holdRaf = requestAnimationFrame(holdTick);
}
async function hatch(){
  S.born = now(); S.lastSeen = now(); S.sessions = 1; S.user.hours[new Date().getHours()]++;
  flash(); buzz([80,40,200]); F.glitch = performance.now()+700;
  [262,330,392,523,659].forEach((f,i)=>tone(f,.5,"triangle",.05,i*.06));
  F.hold = 0; setEmo("surprised"); save(); render(); favicon(); setHint("");
  growDots(0, litCount());
  await wait(1600);
  await say(G.first[0], {glyph:true, emo:"curious"});
  setHint("insegnagli qualcosa. la prima parola che scrivi sarà la sua prima parola.");
  S.litSeen = litCount(); render(); inp.focus();
}
$("#stage").addEventListener("pointerdown", e=>{ if (S.born) { if(!isAsleep()){ setEmo("happy",900); tone(880,.05,"triangle",.03); buzz(15); } return; } holding=true; holdStart=performance.now(); audio(); setHint("ancora…"); holdTick(); });
const release = ()=>{ if (!holding) return; holding=false; cancelAnimationFrame(holdRaf); const decay=setInterval(()=>{ F.hold=Math.max(0,F.hold-.04); if(F.hold<=0) clearInterval(decay); },30); setHint("tieni premuto. di più."); };
["pointerup","pointerleave","pointercancel"].forEach(ev=>$("#stage").addEventListener(ev, release));

/* ================= INPUT ================= */
let ghosts = 0, lastClear = 0, prevLen = 0, ghostFired = false, lastAct = Date.now(), idleFired = 0;
inp.addEventListener("input", ()=>{
  lastAct = Date.now(); F.attn = false;
  if (inp.value.length===0 && prevLen>=6){ ghosts++; lastClear = Date.now(); }
  prevLen = inp.value.length; updCount();
});
$("#bar").addEventListener("submit", async e=>{
  e.preventDefault();
  const msg = inp.value.trim().slice(0, inp.maxLength);
  if (!msg || busy || !S.born || isAsleep()) return;
  inp.value = ""; prevLen = 0; ghosts = 0; updCount(); lastAct = Date.now(); F.attn=false;
  audio(); line("u", esc(msg));
  S.log.push({t:now(), w:"u", x:msg}); if(S.log.length>80) S.log.shift();
  S.lastSeen = now();
  const a = analyze(msg);
  queue(async ()=>{
    if (!S.firstWord){
      const w = a.content[0] || a.toks[0] || msg.split(/\s+/)[0].toLowerCase().slice(0,14);
      learn(msg, a); S.firstWord = w; save();
      setEmo("surprised");
      await say(broken(w), {emo:"curious", raw:true, cap:"la sua prima parola. la ricorderà per sempre."});
      S.awaitName = true; render(); setHint("ora dagli un nome"); return;
    }
    if (S.awaitName){
      const nm = (a.toks[0] || msg.split(/\s+/)[0]).slice(0,12);
      S.name = nm.charAt(0).toUpperCase()+nm.slice(1); S.awaitName = false; learn(msg, a); save(); render();
      await say(S.name.toLowerCase(), {glyph:true, emo:"happy"});
      setHint("ogni parola che userà, l'avrà imparata da te");
      return;
    }
    const newW = learn(msg, a); updateTraits(a);
    S.energy.used++;
    if (newW.length && phase()>=1) setHint(`ha imparato: ${newW.slice(0,3).join(", ")}`);
    await respond(msg, a, newW);
    await checkPhase();
    if (S.energy.used >= ENERGY[phase()]) await sleepNow();
    save(); render();
  });
});
// sorveglianza: bozze cancellate e silenzi
setInterval(()=>{
  if (!S.born || !S.name || busy || isAsleep() || document.hidden) return;
  const p = phase();
  if (!ghostFired && ghosts>=2 && inp.value==="" && Date.now()-lastClear>3000){
    ghostFired = true; F.attn = true;
    queue(()=> p>=3 ? say(fromTemplates("ghost"), {emo:"curious", raw:true}) : say(pick(G.ghost), {glyph:true, emo:"curious"}));
  }
  if (Date.now()-lastAct > 45000 && Date.now()-idleFired > 150000){
    idleFired = Date.now(); F.attn = true; F.gx=0; F.gy=0;
    queue(()=> p>=3 ? say(fromTemplates("idle"), {emo:"curious", raw:true}) : say(pick(G.idle), {glyph:true, emo:"curious"}));
  }
  if (S.energy.sleepUntil && !isAsleep()){ S.energy.sleepUntil = 0; setEmo("surprised",1500); setHint("si è svegliato"); render(); save(); }
}, 1000);
document.addEventListener("visibilitychange", ()=>{
  if (document.hidden){ if (S.born){ S.lastSeen = now(); save(); } }
  else if (S.born && now()-S.lastSeen > 20*60e3){ ghostFired=false; queue(welcome); }
});

/* ================= SCHEDE ================= */
function openSheet(title, html){ $("#pane").innerHTML = `<div class="sh-h"><h2>${esc(title)}</h2><button id="shx" aria-label="Chiudi">×</button></div>${html}`; $("#sheet").classList.add("on"); $("#shx").onclick = closeSheet; }
function closeSheet(){ $("#sheet").classList.remove("on"); }
$("#sheet").addEventListener("click", e=>{ if (e.target.id==="sheet") closeSheet(); });
function showWords(){
  const ws = contentWords(1).sort((a,b)=>S.words[a].f-S.words[b].f);
  openSheet(`${ws.length} parole`, `<p class="muted">tutte quelle che conosce. le ha imparate da te.</p><div class="words">${ws.slice(-400).reverse().map(w=>`<span>${esc(w)}<small>${S.words[w].c}× · ${dstr(S.words[w].f)}</small></span>`).join("")}</div>`);
}
function showDiary(){
  S.diaryUnread = 0; save(); render();
  openSheet("diario", S.diary.length ? `<div id="dl"></div>` : `<p class="muted">ancora vuoto. scrive quando non ci sei.</p>`);
  const dl = $("#dl"); if (!dl) return;
  for (const d of S.diary.slice().reverse()){ const e=document.createElement("div"); e.className="entry"; e.innerHTML=`<time>${dstr(d.t)} · ${hhmm(d.t)}</time>`;
    if (d.g){ e.appendChild(glyphCanvas(d.x, 300)); if (S.revealed){ const tr=document.createElement("div"); tr.className="muted"; tr.textContent="«"+d.x+"»"; e.appendChild(tr); } }
    else { const p=document.createElement("div"); p.textContent=d.x; e.appendChild(p); }
    dl.appendChild(e); }
}
let resetArm = 0;
function showMenu(){
  const tr = S.traits, bars = Object.keys(tr).map(k=>`<div class="row"><span>${k}</span><span>${"●".repeat(Math.round((tr[k]+1)*2.5))}${"○".repeat(5-Math.round((tr[k]+1)*2.5))}</span></div>`).join("");
  openSheet("menu", `
  <p class="muted">codice di legame · salvalo per ritrovarlo su un altro telefono</p>
  <div class="code">${esc(fmtId(S.id))}</div>
  <button class="btn" id="mCopy">copia codice</button>
  <input class="field" id="mCode" placeholder="incolla un codice di legame" autocomplete="off">
  <button class="btn" id="mLink">collega</button>
  <p class="muted" id="mMsg" style="margin-top:10px">${esc(syncState)}</p>
  ${S.born ? `<p class="muted" style="margin-top:18px">carattere</p>${bars}` : ""}
  <div style="margin-top:18px">
    <button class="btn" id="mSound">suono: ${S.sound?"sì":"no"}</button>
    <button class="btn red" id="mReset">ricomincia</button>
  </div>`);
  $("#mCopy").onclick = async ()=>{ try{ await navigator.clipboard.writeText(S.id); $("#mMsg").textContent="copiato"; }catch(e){ $("#mMsg").textContent="copialo a mano: "+fmtId(S.id); } };
  $("#mSound").onclick = ()=>{ S.sound=!S.sound; save(); showMenu(); };
  $("#mReset").onclick = ()=>{ if (Date.now()-resetArm < 3000){ ls.del("impronta_state"); ls.del("impronta_id"); ls.del("impronta_dev"); location.reload(); } else { resetArm=Date.now(); $("#mReset").textContent="tocca di nuovo per cancellarlo"; } };
  $("#mLink").onclick = async ()=>{
    const code = $("#mCode").value.toUpperCase().replace(/[^A-Z0-9]/g,"");
    if (code.length!==16){ $("#mMsg").textContent="il codice ha 16 caratteri"; return; }
    if (!fb){ $("#mMsg").textContent="serve la connessione a Firebase"; return; }
    $("#mMsg").textContent="cerco…";
    const r = await loadRemote(code);
    if (!r){ $("#mMsg").textContent="nessun compagno con questo codice"; return; }
    ID = code; ls.set("impronta_id", ID); S = normalize(r, ID); ls.set("impronta_state", JSON.stringify(S)); location.reload();
  };
}
$("#menuBtn").onclick = showMenu;
// laboratorio nascosto: tocca il logo 5 volte
let taps = [];
$("#logo").addEventListener("click", ()=>{ taps = taps.filter(t=>Date.now()-t<2000); taps.push(Date.now()); if (taps.length>=5){ taps=[]; showLab(); } });
function showLab(){
  openSheet("laboratorio", `<p class="muted">solo per i test</p>
  <button class="btn" data-l="d1">+1 giorno</button><button class="btn" data-l="d7">+7 giorni</button><button class="btn" data-l="h8">+8 ore</button>
  <button class="btn" data-l="wake">sveglia</button><button class="btn" data-l="ph">fase +1</button><button class="btn" data-l="t0">orologio vero</button>
  <p class="muted" style="margin-top:12px">ora simulata: ${new Date(now()).toLocaleString("it-IT")}</p>`);
  $("#pane").querySelectorAll("[data-l]").forEach(b=>b.onclick=()=>{
    const k=b.dataset.l;
    if (k==="d1"||k==="d7"||k==="h8"){ S.lastSeen = now(); save(); devOffset += k==="d1"?DAY:k==="d7"?7*DAY:8*HOUR; ls.set("impronta_dev", devOffset); closeSheet(); ghostFired=false; queue(welcome); }
    if (k==="wake"){ S.energy.sleepUntil=0; S.energy.used=0; setEmo("neutral"); save(); render(); closeSheet(); }
    if (k==="ph"){ S.forcePhase = Math.min(4, phase()+1); save(); closeSheet(); queue(checkPhase); }
    if (k==="t0"){ devOffset=0; ls.set("impronta_dev",0); location.reload(); }
  });
}

/* ================= AVVIO ================= */
(async ()=>{
  requestAnimationFrame(draw);
  render();
  setHint(S.born ? "" : "…");
  await Promise.race([initFB(), wait(3500)]);
  if (fb){ const r = await loadRemote(ID); if (r && (r.updatedAt||0) > (S.updatedAt||0)){ S = normalize(r, ID); buildCells(); ls.set("impronta_state", JSON.stringify(S)); } }
  render();
  if (!S.born){ setHint("tieni premuto"); return; }
  // ricostruisce le ultime righe
  for (const l of S.log.slice(-6)){
    if (l.w==="u") line("u", esc(l.x));
    else { const el=line("c"); if (l.g){ el.appendChild(glyphCanvas(l.x, Math.min(feed.clientWidth*.85,340))); if(S.revealed){ const tr=document.createElement("span"); tr.className="tr"; tr.textContent="«"+l.x+"»"; el.appendChild(tr);} } else el.textContent=l.x; }
  }
  if (S.awaitName) setHint("dagli un nome");
  else if (!S.firstWord) setHint("insegnagli qualcosa");
  queue(welcome);
})();
}
