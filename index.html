<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content">
<meta name="theme-color" content="#000000">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="impronta">
<title>impronta.</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Doto:wght@600;800;900&family=Geist+Mono:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="icon" id="fav" href="data:,">
<style>
/*
VOICE  silenzioso, preciso, vivo: un oggetto che respira
IDEA   un display a punti che nasce e cresce, come un Glyph Matrix
COLOUR nero puro, bianco, grigi; rosso solo come interruzione
TYPE   Doto (dot-matrix) per nomi e numeri, Geist Mono per il testo
*/
:root{color-scheme:dark;--bg:#000;--ink:#f2f2f2;--mid:#8a8a8e;--dim:#3a3a3c;--line:#1c1c1e;--red:#e5161f;--ease:cubic-bezier(.2,.8,.2,1)}
*{box-sizing:border-box;min-width:0;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);overflow:hidden;touch-action:manipulation;overscroll-behavior:none}
body{font:15px/1.5 "Geist Mono",ui-monospace,monospace;-webkit-font-smoothing:antialiased;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
input,.field{user-select:text;-webkit-user-select:text;-webkit-touch-callout:default}
body.unborn main{touch-action:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
#app{height:100dvh;display:flex;flex-direction:column;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);max-width:560px;margin:0 auto;position:relative}
header{display:flex;align-items:center;gap:10px;padding:12px 18px 0;opacity:.9}
#logo{font-family:Doto,monospace;font-weight:900;font-size:20px;letter-spacing:.02em;user-select:none}
#meta{flex:1;text-align:right;color:var(--mid);font-size:11px;letter-spacing:.04em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#menuBtn{width:44px;height:44px;margin-right:-12px;display:grid;place-items:center}
#menuBtn i{display:block;width:4px;height:4px;border-radius:50%;background:var(--ink);box-shadow:-8px 0 0 var(--ink),8px 0 0 var(--ink)}
main{flex:1;display:flex;flex-direction:column;min-height:0}
#stage{display:grid;place-items:center;padding:8px 0 0;touch-action:none;user-select:none;-webkit-user-select:none}
#face{width:min(74vw,40dvh,350px);height:min(74vw,40dvh,350px);display:block;transition:transform .5s var(--ease)}
#face.poke{transform:scale(.94);transition:transform .08s}
#plate{display:flex;align-items:center;justify-content:center;gap:16px;padding:6px 18px 0;min-height:34px}
#cname{font-family:Doto,monospace;font-weight:800;font-size:24px;line-height:1}
#stats{display:flex;gap:14px;color:var(--mid);font-size:11px;align-items:center}
#stats button{color:var(--mid);padding:8px 0;position:relative;letter-spacing:.03em}
#stats .en{letter-spacing:.12em;font-size:10px}
.badge::after{content:"";position:absolute;top:6px;right:-7px;width:5px;height:5px;border-radius:50%;background:var(--red)}
button:focus-visible{outline:1px solid var(--ink);outline-offset:3px;border-radius:4px}
#talk{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:4px 24px;text-align:center;position:relative}
#hint{min-height:18px;color:var(--mid);font-size:11px;letter-spacing:.03em;transition:opacity .5s;margin-bottom:10px}
#hint b{color:var(--red);font-weight:400}
#said{max-width:30ch;font-size:clamp(19px,5.2vw,24px);line-height:1.42;letter-spacing:-.01em;min-height:1.5em;transition:opacity .28s,transform .28s var(--ease),filter .28s;overflow-wrap:anywhere}
#said.out{opacity:0;transform:translateY(-12px);filter:blur(6px)}
#said.ghost{color:var(--dim)}
#said .ch{display:inline;animation:ch .42s var(--ease) both}
@keyframes ch{from{opacity:0;filter:blur(7px)}}
#said .tr{display:block;margin-top:10px;color:var(--mid);font-size:13px;letter-spacing:0;animation:ch .8s .3s both}
#cap{min-height:16px;margin-top:10px;color:var(--mid);font-size:11px;transition:opacity .6s;max-width:34ch}
.think{display:inline-flex;gap:7px;padding:10px 0}
.think i{width:6px;height:6px;border-radius:50%;background:var(--ink);opacity:.2;animation:dot 1.1s infinite}
.think i:nth-child(2){animation-delay:.18s}.think i:nth-child(3){animation-delay:.36s}
@keyframes dot{40%{opacity:1;transform:translateY(-2px)}}
.glyphs{display:inline-flex;flex-wrap:wrap;justify-content:center;gap:10px 16px;max-width:100%}
.gw{display:inline-flex;gap:5px}
.gl{display:block;animation:gl .5s var(--ease) both}
@keyframes gl{from{opacity:0;transform:scale(.4) translateY(4px)}}
.gl.flip{animation:flip .45s var(--ease) both}
@keyframes flip{50%{transform:rotateY(90deg)}}
.letter{display:inline-block;font-family:Doto,monospace;font-weight:800;font-size:22px;animation:ch .5s both}
#oracle{position:absolute;left:0;right:0;bottom:78px;display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none;transition:opacity 1s,transform 1s var(--ease)}
#oracle.off{opacity:0;transform:translateY(6px)}
#oracle .glyphs{opacity:.55}
#oracle small{color:var(--dim);font-size:10px;letter-spacing:.08em}
#dreams{position:absolute;inset:0;pointer-events:none;overflow:hidden}
#dreams .dl{position:absolute;bottom:10%;max-width:70%;color:var(--mid);font-size:13px;opacity:0;animation:dl 7s ease-in-out forwards;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;filter:blur(.4px)}
@keyframes dl{0%{opacity:0;transform:translateY(20px)}20%{opacity:.5}80%{opacity:.3}100%{opacity:0;transform:translateY(-120px);filter:blur(3px)}}
#mine{position:absolute;left:24px;right:24px;bottom:84px;text-align:center;color:var(--mid);font-size:14px;pointer-events:none;opacity:0}
#mine.go{animation:mine 2.6s var(--ease) forwards}
@keyframes mine{0%{opacity:0;transform:translateY(14px)}12%{opacity:1;transform:none}70%{opacity:.8}100%{opacity:0;transform:translateY(-70px);filter:blur(4px)}}
#bar{display:flex;align-items:center;gap:8px;margin:0 12px 12px;padding:6px 6px 6px 18px;border:1px solid var(--dim);border-radius:28px;transition:border-color .3s,opacity .3s}
#bar:focus-within{border-color:var(--mid)}
#bar.off{opacity:.4}
#inp{flex:1;background:none;border:0;outline:0;color:var(--ink);font:16px "Geist Mono",monospace;padding:10px 0}
#inp::placeholder{color:var(--dim)}
#cnt{font-family:Doto,monospace;font-weight:800;font-size:12px;color:var(--dim);white-space:nowrap;transition:color .3s}
#cnt.full{color:var(--red)}
#send{width:44px;height:44px;border-radius:50%;background:var(--ink);color:#000;font-size:20px;display:grid;place-items:center;flex:none;transition:transform .2s var(--ease),background .3s}
#send:active{transform:scale(.9)}
#send:disabled{background:var(--dim)}
#sheet{position:fixed;inset:0;background:rgba(0,0,0,.72);display:flex;align-items:flex-end;justify-content:center;z-index:10;opacity:0;pointer-events:none;transition:opacity .3s}
#sheet.on{opacity:1;pointer-events:auto}
#sheet .pane{width:100%;max-width:560px;max-height:84dvh;overflow-y:auto;background:#0a0a0b;border-top:1px solid var(--dim);border-radius:22px 22px 0 0;padding:20px 20px calc(24px + env(safe-area-inset-bottom));transform:translateY(30px);transition:transform .35s var(--ease)}
#sheet.on .pane{transform:none}
.sh-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.sh-h h2{margin:0;font-family:Doto,monospace;font-weight:900;font-size:26px}
.sh-h button{width:44px;height:44px;font-size:22px;color:var(--mid)}
.row{display:flex;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);font-size:13px}
.row span:last-child{color:var(--mid);text-align:right}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:0 18px;border:1px solid var(--dim);border-radius:22px;font-size:13px;margin:6px 6px 0 0}
.btn.red{border-color:var(--red);color:var(--red)}
.code{font-family:Doto,monospace;font-weight:800;font-size:22px;letter-spacing:.06em;margin:4px 0 8px;word-break:break-all}
.field{width:100%;background:none;border:1px solid var(--dim);border-radius:14px;color:var(--ink);font:16px "Geist Mono",monospace;padding:12px 14px;margin-top:8px;outline:0}
.muted{color:var(--mid);font-size:12px}
.entry{padding:12px 0;border-bottom:1px solid var(--line)}
.entry time{display:block;color:var(--mid);font-size:11px;margin-bottom:4px}
.entry.u{text-align:right;color:var(--mid)}
.poem{font-family:Doto,monospace;font-weight:800;font-size:24px;line-height:1.35;margin:10px 0 16px}
.words{display:flex;flex-wrap:wrap;gap:8px}
.words span{border:1px solid var(--dim);border-radius:14px;padding:5px 10px;font-size:13px}
.words span small{color:var(--mid);margin-left:6px}
.words.lib span{border-style:dashed;color:var(--mid)}
h3.sub{font-size:11px;font-weight:400;letter-spacing:.06em;color:var(--mid);text-transform:uppercase;margin:22px 0 8px}
.entry a{color:var(--mid)}
#map{width:100%;aspect-ratio:1;display:block;border:1px solid var(--line);border-radius:16px;margin:8px 0 6px}
#spark{width:100%;height:46px;display:block;margin:6px 0}
/* ---- HUD: riquadri a punti ---- */
#sheet .pane{max-height:92dvh}
.lead{margin:0 0 14px;line-height:1.6}
.viz{position:relative;margin:6px -6px 4px;border:1px solid var(--line);border-radius:20px;overflow:hidden;background:radial-gradient(120% 90% at 50% 45%,#101012 0%,#050505 70%)}
.viz canvas{display:block;width:100%}
.viz::after{content:"";position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(255,255,255,.018) 0 1px,transparent 1px 3px)}
.viz-cap{position:absolute;left:0;right:0;bottom:0;padding:0 14px 8px;font-size:10px;color:var(--mid);letter-spacing:.04em;text-align:center;pointer-events:none;opacity:0}
.hud{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0 4px}
.tile{border:1px solid var(--line);border-radius:16px;padding:12px 14px 12px;display:flex;flex-direction:column;gap:6px;background:#0d0d0e;min-height:92px;animation:tile .6s var(--ease) both}
.tile.wide{grid-column:1/-1}
.tile small{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--mid)}
.tile b{font-family:Doto,monospace;font-weight:900;font-size:30px;line-height:1;letter-spacing:.01em}
.tile b .dim{color:var(--dim)}
.tile em{font-style:normal;font-size:10px;color:var(--mid);line-height:1.45}
.hud .tile:nth-child(2){animation-delay:.05s}.hud .tile:nth-child(3){animation-delay:.1s}.hud .tile:nth-child(4){animation-delay:.15s}.hud .tile:nth-child(5){animation-delay:.2s}.hud .tile:nth-child(6){animation-delay:.25s}
@keyframes tile{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.seg{display:flex;gap:3px;flex-wrap:nowrap}
.seg i{width:5px;height:5px;border-radius:50%;background:var(--dim);flex:none}
.seg i.on{background:var(--ink)}
.seg.red i.on{background:var(--red)}
h3.hh{display:flex;align-items:center;gap:8px;margin:22px 0 8px;font-size:10px;font-weight:400;letter-spacing:.1em;text-transform:uppercase;color:var(--mid)}
h3.hh i{width:6px;height:6px;border-radius:50%;background:var(--red);flex:none}
h3.hh span{margin-left:auto;letter-spacing:.04em;text-transform:none}
canvas.dots{display:block;width:100%;margin:4px 0 2px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips span{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--dim);border-radius:13px;padding:4px 10px;font-size:12px}
.chips span small{color:var(--mid);font-size:10px}
.chips.lib span{border-style:dashed;color:var(--mid)}
.chips span.hot{border-color:var(--ink)}
.winfo{min-height:44px;margin:8px 2px 0;font-size:12px;line-height:1.6}
.winfo b{font-family:Doto,monospace;font-weight:900;font-size:20px;color:var(--ink);margin-right:6px}
.card{border:1px solid var(--line);border-radius:16px;padding:12px 14px;margin:8px 0;background:#0d0d0e}
.card header{display:flex;justify-content:space-between;gap:8px;padding:0;font-size:10px;color:var(--mid);letter-spacing:.04em;opacity:1;margin-bottom:6px}
.card header b{font-family:Doto,monospace;font-weight:900;font-size:16px;color:var(--ink);letter-spacing:0}
.card a{color:var(--mid)}
.card p{margin:0;font-size:13px;line-height:1.55}
.prog{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:12px}
.prog small{color:var(--mid);font-size:10px}
.prog .ell{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:44vw}
.tl{position:relative;padding-left:22px}
.tl::before{content:"";position:absolute;left:6px;top:8px;bottom:8px;border-left:1px dotted var(--dim)}
.tl .entry{position:relative;border:0;padding:10px 0}
.tl .entry::before{content:"";position:absolute;left:-20px;top:15px;width:7px;height:7px;border-radius:50%;background:var(--ink)}
.tl .entry.srv::before{background:var(--red)}
.tl .entry.g::before{background:var(--mid)}
.num{font-family:Doto,monospace;font-weight:800;color:var(--ink)}
#boot{position:fixed;inset:0;background:#000;z-index:40;transition:opacity .55s,filter .55s;overflow:hidden}
#boot.out{opacity:0;filter:blur(6px);pointer-events:none}
#boot.fade #bootl,#boot.fade #boots,#boot.fade #bootk{opacity:0;transition:opacity .35s}
#boot.morph #bootl,#boot.morph #bootk{opacity:0;transform:translateY(-8px);filter:blur(4px);transition:opacity .4s,transform .4s,filter .4s}
#bootc{position:absolute;inset:0;width:100%;height:100%;display:block}
#bootl{position:absolute;left:0;right:0;top:calc(env(safe-area-inset-top) + 9dvh);text-align:center;font-family:Doto,monospace;font-weight:900;font-size:34px;letter-spacing:.04em;min-height:40px}
#bootl span{display:inline-block;animation:bl .5s var(--ease) both}
#bootl span.g{color:var(--red)}
@keyframes bl{0%{opacity:0;transform:translateY(6px);filter:blur(3px)}60%{opacity:1;filter:none}100%{opacity:1;transform:none}}
#boots{position:absolute;left:22px;right:22px;bottom:calc(env(safe-area-inset-bottom) + 34px);margin:0;font:11px/1.9 "Geist Mono",monospace;color:var(--mid);white-space:pre-wrap;letter-spacing:.03em}
#boots div{animation:bl .35s var(--ease) both}
#boots b{color:var(--ink);font-weight:400}
#boots i{display:inline-block;width:5px;height:5px;border-radius:50%;background:var(--red);margin-right:9px;vertical-align:middle;transition:background .3s}
#boots i.ok{background:var(--ink)}
#bootk{position:absolute;right:22px;top:calc(env(safe-area-inset-top) + 16px);font:10px "Geist Mono",monospace;color:var(--dim);letter-spacing:.08em}
#flash{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:20;transition:opacity 1.2s}
#flash.on{opacity:.9;transition:none}
@media (prefers-reduced-motion:reduce){#said .ch,.gl,#mine.go{animation:none}#flash{display:none}}
@media (max-height:620px){#face{width:min(60vw,34dvh,300px);height:min(60vw,34dvh,300px)}#said{font-size:18px}}
</style>
</head>
<body>
<div id="app">
  <header>
    <div id="logo">impronta.</div>
    <div id="meta"></div>
    <button id="menuBtn" aria-label="Menu"><i></i></button>
  </header>
  <main>
    <div id="stage"><canvas id="face" aria-label="Il volto del compagno"></canvas></div>
    <div id="plate"><span id="cname"></span><span id="stats"></span></div>
    <section id="talk">
      <div id="hint"></div>
      <div id="said" aria-live="polite"></div>
      <div id="cap"></div>
    </section>
  </main>
  <div id="oracle" class="off"></div>
  <div id="mine"></div>
  <form id="bar" class="off" autocomplete="off">
    <input id="inp" type="text" maxlength="40" placeholder="" disabled enterkeyhint="send" autocapitalize="off">
    <span id="cnt"></span>
    <button id="send" type="submit" aria-label="Invia" disabled>→</button>
  </form>
</div>
<div id="sheet"><div class="pane" id="pane"></div></div>
<div id="flash"></div>
<div id="boot"><canvas id="bootc"></canvas><div id="bootl"></div><div id="bootk">tocca per saltare</div><div id="boots"></div></div>
<script>
/* file sempre aggiornati: alla prima volta che il service worker prende il controllo, ricarica una volta */
if ("serviceWorker" in navigator && location.protocol === "https:"){
  const had = !!navigator.serviceWorker.controller;
  navigator.serviceWorker.register("sw.js").catch(() => {});
  navigator.serviceWorker.addEventListener("controllerchange", () => { try { if (!had && !sessionStorage.getItem("impronta_sw")){ sessionStorage.setItem("impronta_sw", "1"); location.reload(); } } catch (e){} });
}
</script>
<script type="module" src="app.js"></script>
</body>
</html>
